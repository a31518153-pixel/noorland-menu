<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة تحكم — منيو نور لاند / مطعم المرجان</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Markazi+Text:wght@500;600;700&family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --sea-deep:#0E3B36;
  --sea-deeper:#0A2D29;
  --coral:#FF6F51;
  --coral-soft:#FFE8E0;
  --sand:#F5EDE0;
  --gold:#C9A227;
  --line: rgba(245,237,224,0.16);
  --danger:#E1543B;
  --card:#123F3A;
}
*{box-sizing:border-box; margin:0; padding:0;}
html{scroll-behavior:smooth;}
body{
  background:var(--sea-deep); color:var(--sand);
  font-family:'Tajawal', sans-serif; min-height:100vh; overflow-x:hidden;
}
@media (prefers-reduced-motion: reduce){ *{animation:none !important; transition:none !important;} }
img{ max-width:100%; display:block; }

.coral-divider{ width:100%; height:40px; }
.coral-divider svg{ width:100%; height:100%; display:block; }
.coral-divider path{ stroke:var(--coral); opacity:.55; }

/* ---------- Header ---------- */
.hero{
  position:relative; padding:48px 24px 30px; text-align:center;
  background:
    radial-gradient(circle at 18% 20%, rgba(255,111,81,0.16), transparent 45%),
    radial-gradient(circle at 82% 75%, rgba(201,162,39,0.10), transparent 42%),
    var(--sea-deeper);
  border-bottom:1px solid var(--line);
}
.logo-box{
  width:84px; height:84px; border-radius:50%; margin:0 auto 16px; overflow:hidden;
  border:2px dashed rgba(255,111,81,0.4); background:rgba(255,111,81,0.06);
  display:flex; align-items:center; justify-content:center; position:relative;
}
.logo-box img{ width:100%; height:100%; object-fit:cover; }
.logo-box .ph{ font-size:11px; color:rgba(245,237,224,0.45); text-align:center; padding:6px; line-height:1.3; }
.logo-url-input{
  display:none; width:200px; margin:8px auto 0; font-size:11px; background:transparent; color:rgba(245,237,224,0.7);
  border:1px dashed var(--line); border-radius:6px; text-align:center; padding:5px; font-family:'Tajawal',sans-serif;
}
body.edit-mode .logo-url-input{ display:block; }

.hero-eyebrow-input, .hero-eyebrow{
  font-size:13px; letter-spacing:.22em; color:var(--coral); font-weight:700; margin-bottom:10px;
  background:transparent; border:none; text-align:center; font-family:'Tajawal',sans-serif; width:100%;
}
.hero-title-input, .hero h1{
  font-family:'Markazi Text', serif; font-weight:700; font-size:clamp(38px, 8vw, 62px); line-height:1.05;
  background:transparent; border:none; text-align:center; color:var(--sand); width:100%;
}
.hero .sub{ margin-top:8px; font-family:'Markazi Text', serif; font-size:clamp(16px, 3vw, 21px); color:var(--coral-soft); font-weight:500; }
body.edit-mode .hero-eyebrow-input, body.edit-mode .hero-title-input{ border-bottom:1px dashed var(--line); }

.toolbar{
  position:sticky; top:0; z-index:40; display:flex; align-items:center; gap:8px; justify-content:center; flex-wrap:wrap;
  padding:12px 16px; background:rgba(10,45,41,0.96); backdrop-filter:blur(10px); border-bottom:1px solid var(--line);
}
.btn{
  font-family:'Tajawal', sans-serif; font-size:13.5px; font-weight:500;
  padding:8px 16px; border-radius:999px; border:1px solid var(--line);
  background:transparent; color:var(--sand); cursor:pointer; transition:all .2s ease; white-space:nowrap;
}
.btn:hover{ border-color:var(--coral); color:var(--coral); }
.btn.primary{ background:var(--coral); border-color:var(--coral); color:var(--sea-deeper); font-weight:700; }
.btn.primary:hover{ opacity:.9; color:var(--sea-deeper); }
.btn.ghost-danger{ color:rgba(225,84,59,0.85); }
.btn.ghost-danger:hover{ border-color:var(--danger); color:var(--danger); }
.save-note{ font-size:12px; color:rgba(245,237,224,0.5); }

.cart-btn{ position:relative; }
.cart-badge{
  position:absolute; top:-7px; left:-7px; background:var(--coral); color:var(--sea-deeper);
  font-size:11px; font-weight:700; border-radius:999px; min-width:18px; height:18px;
  display:flex; align-items:center; justify-content:center; padding:0 4px;
}

/* ---------- Category chips ---------- */
.catnav{
  position:sticky; top:49px; z-index:30; background:rgba(10,45,41,0.94); backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line); overflow-x:auto; white-space:nowrap;
  padding:14px 16px; display:flex; gap:14px; scrollbar-width:none;
}
.catnav::-webkit-scrollbar{ display:none; }
.catchip{
  display:inline-flex; flex-direction:column; align-items:center; gap:6px; flex-shrink:0;
  text-decoration:none; color:rgba(245,237,224,0.75); cursor:pointer; width:70px; white-space:normal;
}
.catchip .thumb{
  width:52px; height:52px; border-radius:50%; overflow:hidden; border:2px solid var(--line);
  background:var(--card); display:flex; align-items:center; justify-content:center; transition:border-color .2s ease;
}
.catchip .thumb img{ width:100%; height:100%; object-fit:cover; }
.catchip .thumb .ph{ font-size:18px; color:rgba(255,111,81,0.6); }
.catchip span.label{
  font-size:10.5px; text-align:center; line-height:1.25; white-space:normal; word-break:break-word;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; max-height:2.6em;
}
.catchip.active .thumb{ border-color:var(--coral); }
.catchip.active span.label{ color:var(--coral); }
.catchip .imgurl-input{
  display:none; width:70px; font-size:9px; margin-top:2px; background:transparent; color:rgba(245,237,224,0.6);
  border:1px dashed var(--line); border-radius:4px; text-align:center; padding:2px;
}
body.edit-mode .catchip .imgurl-input{ display:block; }

/* ---------- Content ---------- */
.wrap{ max-width:960px; margin:0 auto; padding:0 20px; }
.section{ padding:42px 0 14px; scroll-margin-top:150px; }
.section-head{ display:flex; align-items:baseline; gap:14px; margin-bottom:6px; }
.section-num{ font-family:'Markazi Text', serif; font-size:15px; color:var(--coral); font-weight:600; }
.section-title-input, .section-head h2{
  font-family:'Markazi Text', serif; font-size:clamp(26px, 4.5vw, 34px); font-weight:700;
  color:var(--sand); background:transparent; border:none; flex:1;
}
.section-note-input, .section-note{
  width:100%; font-size:12.5px; color:rgba(245,237,224,0.55); background:transparent; border:none;
  margin-bottom:20px; font-family:'Tajawal', sans-serif;
}
body.edit-mode .section-title-input, body.edit-mode .section-note-input{ border-bottom:1px solid var(--line); padding:2px 0; }

/* ---------- Item cards ---------- */
.item-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(215px,1fr)); gap:14px; }
.item-card{
  background:var(--card); border:1px solid var(--line); border-radius:14px; overflow:hidden;
  display:flex; flex-direction:column; transition:transform .2s ease, border-color .2s ease;
}
.item-card:hover{ border-color:rgba(255,111,81,0.4); }
.item-imgbox{
  width:100%; aspect-ratio:4/3; background:linear-gradient(135deg, rgba(255,111,81,0.10), rgba(201,162,39,0.06));
  display:flex; align-items:center; justify-content:center; position:relative; overflow:hidden;
}
.item-imgbox img{ width:100%; height:100%; object-fit:cover; }
.item-imgbox .ph{ font-size:26px; color:rgba(255,111,81,0.35); }
.item-imgurl-input{
  display:none; position:absolute; bottom:0; right:0; left:0; font-size:10px; padding:5px 8px;
  background:rgba(10,45,41,0.85); color:var(--sand); border:none; border-top:1px dashed var(--line);
}
body.edit-mode .item-imgurl-input{ display:block; }

.item-body{ padding:12px; display:flex; flex-direction:column; gap:5px; flex:1; }
.item-name-input, .item-name{
  font-size:15px; font-weight:500; color:var(--sand); background:transparent; border:none;
  font-family:'Tajawal', sans-serif; width:100%;
}
.item-desc-input, .item-desc{
  font-size:11.5px; color:rgba(245,237,224,0.55); background:transparent; border:none;
  font-family:'Tajawal', sans-serif; font-weight:300; width:100%;
}
body.edit-mode .item-name-input, body.edit-mode .item-desc-input, body.edit-mode .item-price-input{
  border-bottom:1px solid var(--line); padding:2px 0;
}

.item-foot{ display:flex; align-items:center; justify-content:space-between; margin-top:auto; padding-top:6px; }
.price-wrap{ display:flex; align-items:center; gap:4px; }
.item-price-input, .item-price{
  font-family:'Markazi Text', serif; font-size:17px; font-weight:600; color:var(--coral);
  background:transparent; border:none; width:60px; text-align:left;
}
.price-unit{ font-size:10.5px; color:rgba(255,111,81,0.7); }

.qty-controls{ display:flex; align-items:center; gap:7px; }
.qty-btn{
  width:24px; height:24px; border-radius:50%; border:1px solid var(--coral); background:transparent;
  color:var(--coral); font-size:14px; cursor:pointer; display:flex; align-items:center; justify-content:center; line-height:1;
}
.qty-btn:hover{ background:var(--coral); color:var(--sea-deeper); }
.qty-num{ font-size:13px; min-width:12px; text-align:center; }
.add-cart-btn{
  font-size:12px; padding:6px 12px; border-radius:999px; border:1px solid var(--coral); background:transparent;
  color:var(--coral); cursor:pointer; font-family:'Tajawal',sans-serif;
}
.add-cart-btn:hover{ background:var(--coral); color:var(--sea-deeper); }

.del-item{
  display:none; align-self:flex-end; background:none; border:none; color:rgba(225,84,59,0.75);
  cursor:pointer; font-size:12px; padding:2px 4px;
}
body.edit-mode .del-item{ display:inline-block; }

.add-item-btn{
  display:none; margin-top:14px; font-size:12.5px; color:var(--coral); background:none;
  border:1px dashed var(--coral); border-radius:10px; padding:14px; cursor:pointer; width:100%;
  font-family:'Tajawal', sans-serif;
}
body.edit-mode .add-item-btn{ display:block; }

.section-actions{ display:none; gap:8px; margin-top:14px; }
body.edit-mode .section-actions{ display:flex; }
.add-section-wrap{ display:none; padding:26px 0 56px; text-align:center; }
body.edit-mode .add-section-wrap{ display:block; }

/* ---------- Cart drawer ---------- */
.cart-overlay{ position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:90; opacity:0; pointer-events:none; transition:opacity .25s ease; }
.cart-overlay.open{ opacity:1; pointer-events:auto; }
.cart-drawer{
  position:fixed; top:0; bottom:0; left:0; width:min(360px, 90vw); background:var(--sea-deeper); z-index:91;
  transform:translateX(-100%); transition:transform .3s ease; border-inline-end:1px solid var(--line);
  display:flex; flex-direction:column; padding:22px;
}
.cart-drawer.open{ transform:translateX(0); }
.cart-drawer h3{ font-family:'Markazi Text', serif; font-size:24px; color:var(--coral); margin-bottom:14px; }
.cart-list{ flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:10px; }
.cart-row{ display:flex; justify-content:space-between; align-items:center; font-size:13.5px; gap:8px; }
.cart-empty{ color:rgba(245,237,224,0.5); font-size:13px; text-align:center; margin-top:26px; }
.cart-total{ border-top:1px solid var(--line); margin-top:14px; padding-top:14px; display:flex; justify-content:space-between; font-family:'Markazi Text', serif; font-size:19px; }
.cart-close{ align-self:flex-end; background:none; border:none; color:var(--sand); font-size:19px; cursor:pointer; margin-bottom:4px; }

/* ---------- Admin gate ---------- */
.gate{
  position:fixed; inset:0; background:var(--sea-deep); z-index:100; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:16px; padding:24px; text-align:center;
}
.gate h2{ font-family:'Markazi Text', serif; color:var(--coral); font-size:28px; }
.gate p{ font-size:13px; color:rgba(245,237,224,0.6); max-width:320px; }
.gate input{
  font-size:22px; letter-spacing:6px; text-align:center; padding:10px 14px; border-radius:10px; border:1px solid var(--line);
  background:var(--card); color:var(--sand); width:160px; font-family:'Tajawal',sans-serif;
}
.gate .err{ color:var(--danger); font-size:12.5px; min-height:16px; }

footer{ margin-top:16px; padding:34px 24px 54px; text-align:center; border-top:1px solid var(--line); background:var(--sea-deeper); }
footer .mark{ font-family:'Markazi Text', serif; font-size:20px; color:var(--coral); margin-bottom:6px; }
footer p{ font-size:11.5px; color:rgba(245,237,224,0.5); line-height:1.8; }

@media (max-width:520px){ .item-foot{ flex-wrap:wrap; gap:6px; } }

/* ---------- Enhancements: motion ---------- */
.section{ opacity:0; transform:translateY(18px); transition:opacity .6s ease, transform .6s ease; }
.section.in-view{ opacity:1; transform:translateY(0); }
.item-card{ opacity:0; transform:translateY(14px) scale(.98); transition:opacity .45s ease, transform .45s ease, border-color .2s ease, box-shadow .25s ease; }
.item-card.in-view{ opacity:1; transform:translateY(0) scale(1); }
.item-card:hover{ border-color:rgba(255,111,81,0.5); box-shadow:0 10px 26px rgba(0,0,0,0.28); transform:translateY(-3px) scale(1.012); }
.btn{ transition:all .2s ease, transform .12s ease; }
.btn:active{ transform:scale(.94); }
.catchip .thumb{ transition:border-color .2s ease, transform .2s ease; }
.catchip:hover .thumb{ transform:scale(1.08); }
.toolbar{ transition:box-shadow .25s ease; }
.toolbar.scrolled{ box-shadow:0 6px 20px rgba(0,0,0,0.3); }
.section-num{ position:relative; }
.section-head h2, .section-title-input{ position:relative; }
.section-head{ position:relative; }
.section-head::after{ content:''; }

/* ---------- Image upload controls (admin) ---------- */
.hidden-file-input{ display:none; }
.img-upload-wrap{ display:none; gap:5px; padding:6px; background:rgba(10,45,41,0.9); border-top:1px dashed var(--line); position:absolute; inset:auto 0 0 0; }
body.edit-mode .img-upload-wrap{ display:flex; }
.img-upload-btn, .img-remove-btn{
  flex:1; font-size:10.5px; padding:6px 4px; border-radius:7px; border:1px solid var(--line); background:rgba(10,45,41,0.6);
  color:var(--sand); cursor:pointer; font-family:'Tajawal',sans-serif; transition:all .2s ease;
}
.img-upload-btn:hover{ border-color:var(--coral); color:var(--coral); }
.img-remove-btn:hover{ border-color:var(--danger); color:var(--danger); }

.logo-upload-row{ display:none; justify-content:center; gap:8px; margin-top:10px; }
body.edit-mode .logo-upload-row{ display:flex; }

.chip-img-actions{ display:none; }
body.edit-mode .chip-img-actions{ display:block; margin-top:2px; }
.chip-img-btn{
  font-size:8.5px; padding:2px 5px; border-radius:5px; border:1px dashed var(--line); background:transparent;
  color:rgba(245,237,224,0.65); cursor:pointer; font-family:'Tajawal',sans-serif; white-space:nowrap;
}
.chip-img-btn:hover{ border-color:var(--coral); color:var(--coral); }

/* item move + delete row */
.item-actions-row{ display:none; align-items:center; justify-content:space-between; margin-top:4px; gap:4px; }
body.edit-mode .item-actions-row{ display:flex; }
.item-move-btn{
  width:22px; height:22px; border-radius:6px; border:1px solid var(--line); background:transparent; color:var(--sand);
  cursor:pointer; font-size:11px; display:flex; align-items:center; justify-content:center;
}
.item-move-btn:hover{ border-color:var(--coral); color:var(--coral); }

/* save status coloring */
.save-note.saving{ color:var(--gold); }
.save-note.ok{ color:#7FD9A0; }
.save-note.err{ color:var(--danger); font-weight:700; }

/* header sub-label editor */
.menu-label-input{ display:none; font-size:12px; color:rgba(245,237,224,0.5); text-align:center; background:transparent; border:none; width:100%; margin-top:6px; font-family:'Tajawal',sans-serif; }
body.edit-mode .menu-label-input{ display:block; border-bottom:1px dashed var(--line); padding-bottom:5px; max-width:320px; margin-inline:auto; }

/* footer editing */
body.edit-mode footer .mark{ display:none; }
footer .mark-input{ display:none; }
body.edit-mode footer .mark-input{
  display:block; font-family:'Markazi Text', serif; font-size:20px; color:var(--coral); margin:0 auto 8px;
  text-align:center; background:transparent; border:none; border-bottom:1px dashed var(--line); max-width:320px; padding-bottom:4px;
}
footer p.footer-text-display{ display:block; }
body.edit-mode footer p.footer-text-display{ display:none; }
footer textarea.footer-text-input{ display:none; }
body.edit-mode footer textarea.footer-text-input{
  display:block; width:100%; max-width:420px; margin:0 auto; text-align:center; background:transparent;
  color:rgba(245,237,224,0.7); border:1px dashed var(--line); border-radius:8px; padding:9px; font-family:'Tajawal',sans-serif;
  font-size:11.5px; resize:vertical; min-height:44px;
}

</style>
</head>
<body>

<div class="gate" id="gate">
  <h2>لوحة تحكم المنيو</h2>
  <p>أدخل رمز الدخول الخاص بالإدارة للمتابعة إلى التحكم بمنيو نور لاند - مطعم المرجان</p>
  <input type="password" id="pinInput" inputmode="numeric" maxlength="6" placeholder="••••">
  <div class="err" id="pinErr"></div>
  <button class="btn primary" id="unlockBtn">دخول</button>
</div>

<header class="hero">
  <div class="logo-box" id="logoImg"></div>
  <div class="logo-upload-row">
    <button type="button" class="img-upload-btn" id="logoUploadBtn" style="flex:none; padding:7px 14px;">⬆ رفع الشعار</button>
    <button type="button" class="img-remove-btn" id="logoRemoveBtn" style="flex:none; padding:7px 14px;">✕ إزالة</button>
    <input type="file" accept="image/*" class="hidden-file-input" id="logoFileInput">
  </div>
  <input class="hero-eyebrow-input" id="eyebrowInput" placeholder="اسم الفندق">
  <input class="hero-title-input" id="titleInput" placeholder="اسم المطعم">
  <div class="sub">لوحة تحكم المنيو</div>
  <input class="menu-label-input" id="menuLabelInput" placeholder="النص الفرعي عند الزبون (مثال: المنيو)">
</header>

<div class="toolbar">
  <button class="btn primary" id="saveNowBtn">💾 حفظ الآن</button>
  <button class="btn" id="addSectionTop">➕ قسم جديد</button>
  <button class="btn" id="refreshBtn">🔄 تحديث</button>
  <button class="btn" id="openCustomerBtn">↗ فتح صفحة الزبون</button>
  <span class="save-note" id="saveNote"></span>
</div>

<nav class="catnav" id="catnav"></nav>

<main class="wrap" id="sectionsRoot"></main>

<div class="add-section-wrap">
  <button class="btn" id="addSectionBottom">➕ إضافة قسم جديد بالأسفل</button>
</div>

<footer>
  <div class="mark">لوحة التحكم</div>
  <div class="mark-input-wrap" style="margin-top:14px;">
    <input class="mark-input" id="footerMarkInput" placeholder="اسم المطعم في تذييل صفحة الزبون">
  </div>
  <p>كل تعديل هنا يُحفظ محليًا وينشر تلقائيًا لصفحة الزبون خلال ثوانٍ</p>
  <p class="footer-text-display" id="footerTextDisplay" style="margin-top:6px;"></p>
  <textarea class="footer-text-input" id="footerTextInput" rows="2" placeholder="نص أسفل صفحة الزبون (مثل: تعليمات الطلب)"></textarea>
</footer>

<script>
// بيانات منيو نور لاند - مطعم المرجان (القيم الافتراضية عند أول تشغيل)
// كل صنف: [الاسم بالعربي, السعر بالدينار, وصف قصير (اختياري)]
const DEFAULT_MENU = {
  hotelName: "نور لاند",
  restaurantName: "مطعم المرجان",
  logoUrl: "",
  sections: [
    { title: "الشوربات", note: "", items: [
      ["شوربة العدس", 3000, ""],
      ["شوربة الدجاج", 4000, ""],
      ["شوربة الخضار", 4000, ""],
      ["شوربة نور لاند الخاصة", 5000, ""],
      ["شوربة الفطر", 4000, ""]
    ]},
    { title: "السلطات", note: "", items: [
      ["سلطة القيصر", 7000, "خس مقرمش مع كروتون ذهبي وجبنة بارميزان، تقدم مع صوص السيزر"],
      ["السلطة الخضراء", 6000, "طماطم طازجة، خيار، فلفل ملون، أوريغانو ونعناع طازج مع صوص زيت الليمون"],
      ["السلطة اليونانية", 7000, "خس مقرمش، فلفل ملون، جبنة فيتا، فجل وزيتون أسود مع مستحلب الليمون"],
      ["السلطة العربية", 5000, ""],
      ["فتوش", 5000, "خضار مشكلة مع خبز مقرمش، زيت زيتون، ليمون ودبس رمان"],

<script>
const STORAGE_KEY = 'noorland-almurjan-menu-v1';
const ADMIN_PIN = '1234'; // غيّر هذا الرمز بالبحث عن ADMIN_PIN داخل الكود

// ============================================================
// إعداد قاعدة البيانات السحابية (Firebase Realtime Database)
// الحماية هنا بـ PIN فقط. تذكّر أن تجعل قواعد الأمان في Firebase مطابقة:
// { "rules": { "menu": { ".read": true, ".write": true } } }
// ============================================================
const FIREBASE_DB_URL = "https://menu-noorland-default-rtdb.firebaseio.com";
const CLOUD_ENABLED = !!FIREBASE_DB_URL;
const CLOUD_ENDPOINT = CLOUD_ENABLED ? (FIREBASE_DB_URL.replace(/\/$/, '') + '/menu.json') : null;

let state = null;
let saveTimer = null;
let dirty = false;
let editMode = true; // admin page always starts in edit mode after unlocking

// قناة بث فورية بين تبويبات نفس المتصفح (احتياط إضافي محلي)
const syncChannel = ('BroadcastChannel' in window) ? new BroadcastChannel('noorland-menu-sync') : null;

function uid(prefix){ return prefix + '_' + Math.random().toString(36).slice(2,9); }
function fmtPrice(p){
  const n = String(p).replace(/[^\d]/g,'');
  if(!n) return '';
  return Number(n).toLocaleString('en-US');
}

async function loadState(){
  if(CLOUD_ENABLED){
    try{
      const res = await fetch(CLOUD_ENDPOINT, { cache:'no-store' });
      if(res.ok){
        const data = await res.json();
        if(data){ state = data; try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); }catch(e){} return; }
      }
    }catch(e){ /* سنكمل بالتخزين المحلي كنسخة احتياطية */ }
  }
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){ state = JSON.parse(raw); return; }
  }catch(e){}
  if(!state) state = buildDefaultData();
}

function setNote(text, cls){
  const note = document.getElementById('saveNote');
  note.textContent = text;
  note.className = 'save-note' + (cls ? ' ' + cls : '');
}

async function persist(){
  clearTimeout(saveTimer);
  setNote('جارِ الحفظ…', 'saving');
  const json = JSON.stringify(state);
  // نحفظ محليًا دائمًا كنسخة احتياطية فورية
  try{ localStorage.setItem(STORAGE_KEY, json); }catch(e){}

  if(CLOUD_ENABLED){
    try{
      const res = await fetch(CLOUD_ENDPOINT, { method:'PUT', headers:{'Content-Type':'application/json'}, body: json });
      if(!res.ok) throw new Error('cloud-write-failed');
      dirty = false;
      setNote('تم الحفظ ✓ — نُشر لكل الزبائن فورًا', 'ok');
    }catch(e){
      dirty = false;
      setNote('تم الحفظ محليًا فقط — تعذّر الوصول للسحابة، تحقق من الاتصال', 'err');
    }
  } else {
    dirty = false;
    if(syncChannel){ try{ syncChannel.postMessage({ type:'menu-updated', at: Date.now() }); }catch(e){} }
    setNote('تم الحفظ محليًا ✓ (لم يتم إعداد قاعدة بيانات سحابية بعد)', 'ok');
  }
  setTimeout(()=>{ const n = document.getElementById('saveNote'); if(n.classList.contains('ok')) setNote('',''); }, 3200);
}
function scheduleSave(){ dirty = true; setNote('تغييرات غير محفوظة — اضغط "💾 حفظ الآن"', ''); }
async function saveNow(){ await persist(); }

window.addEventListener('beforeunload', (e) => {
  if(dirty){ e.preventDefault(); e.returnValue = ''; }
});

// يضغط الصورة ويحوّلها إلى صيغة قابلة للتخزين محليًا (Data URL)
function readImageAsDataUrl(file, maxDim){
  maxDim = maxDim || 900;
  return new Promise((resolve, reject) => {
    if(!file) return reject(new Error('no-file'));
    if(!file.type || !file.type.startsWith('image/')) return reject(new Error('not-image'));
    const reader = new FileReader();
    reader.onerror = () => reject(reader.error || new Error('read-failed'));
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error('decode-failed'));
      img.onload = () => {
        let { width, height } = img;
        if(width > maxDim || height > maxDim){
          const ratio = Math.min(maxDim / width, maxDim / height);
          width = Math.round(width * ratio); height = Math.round(height * ratio);
        }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', 0.82));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

function observeAnimations(){
  const io = new IntersectionObserver((entries) => {
    entries.forEach(en => { if(en.isIntersecting){ en.target.classList.add('in-view'); io.unobserve(en.target); } });
  }, { threshold: 0.1 });
  document.querySelectorAll('.section, .item-card').forEach(el => io.observe(el));
}
window.addEventListener('scroll', () => {
  const tb = document.querySelector('.toolbar');
  if(tb) tb.classList.toggle('scrolled', window.scrollY > 4);
}, { passive:true });

function render(){
  document.getElementById('logoImg').innerHTML = '';
  const logoBox = document.getElementById('logoImg');
  if(state.logoUrl){ const img = document.createElement('img'); img.src = state.logoUrl; logoBox.appendChild(img); }
  else{ const ph = document.createElement('span'); ph.className='ph'; ph.textContent='مكان الشعار'; logoBox.appendChild(ph); }
  document.getElementById('logoRemoveBtn').style.display = state.logoUrl ? 'block' : 'none';
  document.getElementById('eyebrowInput').value = state.hotelName || '';
  document.getElementById('titleInput').value = state.restaurantName || '';
  document.getElementById('menuLabelInput').value = state.menuLabel || '';
  document.getElementById('footerMarkInput').value = state.footerMark || '';
  document.getElementById('footerTextInput').value = state.footerText || '';
  document.getElementById('footerTextDisplay').textContent = state.footerText || '';

  const root = document.getElementById('sectionsRoot');
  const nav = document.getElementById('catnav');
  root.innerHTML = ''; nav.innerHTML = '';

  state.sections.forEach((sec, si) => {
    const chip = document.createElement('a');
    chip.className = 'catchip'; chip.href = '#' + sec.id;
    const thumb = document.createElement('div'); thumb.className = 'thumb';
    if(sec.image){ const img = document.createElement('img'); img.src = sec.image; thumb.appendChild(img); }
    else { const ph = document.createElement('span'); ph.className='ph'; ph.textContent='🍽'; thumb.appendChild(ph); }
    const label = document.createElement('span'); label.className='label'; label.textContent = sec.title || 'قسم';
    chip.appendChild(thumb); chip.appendChild(label);

    const chipImgActions = document.createElement('div'); chipImgActions.className = 'chip-img-actions';
    const chipImgBtn = document.createElement('button');
    chipImgBtn.type='button'; chipImgBtn.className='chip-img-btn'; chipImgBtn.textContent = sec.image ? '🖼 تغيير' : '⬆ صورة';
    const chipFileInput = document.createElement('input');
    chipFileInput.type='file'; chipFileInput.accept='image/*'; chipFileInput.className='hidden-file-input';
    chipImgBtn.addEventListener('click', e => { e.preventDefault(); chipFileInput.click(); });
    chipFileInput.addEventListener('click', e => e.stopPropagation());
    chipFileInput.addEventListener('change', async e => {
      const file = e.target.files[0]; if(!file) return;
      try{ sec.image = await readImageAsDataUrl(file, 300); scheduleSave(); render(); }
      catch(err){ alert('تعذّر رفع الصورة'); }
    });
    chipImgActions.appendChild(chipImgBtn); chipImgActions.appendChild(chipFileInput);
    chip.appendChild(chipImgActions);
    nav.appendChild(chip);

    const secEl = document.createElement('section'); secEl.className = 'section'; secEl.id = sec.id;
    const head = document.createElement('div'); head.className = 'section-head';
    const numSpan = document.createElement('span'); numSpan.className='section-num'; numSpan.textContent = String(si+1).padStart(2,'0');
    const titleInput = document.createElement('input');
    titleInput.className = 'section-title-input'; titleInput.value = sec.title; titleInput.disabled = !editMode;
    titleInput.addEventListener('input', e => { sec.title = e.target.value; scheduleSave(); label.textContent = e.target.value || 'قسم'; });
    head.appendChild(numSpan); head.appendChild(titleInput);
    secEl.appendChild(head);

    const noteInput = document.createElement('input');
    noteInput.className = 'section-note-input'; noteInput.placeholder = 'ملاحظة القسم (اختياري)';
    noteInput.value = sec.note || ''; noteInput.disabled = !editMode;
    noteInput.addEventListener('input', e => { sec.note = e.target.value; scheduleSave(); });
    secEl.appendChild(noteInput);

    const grid = document.createElement('div'); grid.className = 'item-grid';
    sec.items.forEach((item, ii) => grid.appendChild(buildItemCard(sec, item, ii)));
    secEl.appendChild(grid);

    const addItemBtn = document.createElement('button');
    addItemBtn.className = 'add-item-btn'; addItemBtn.textContent = '➕ إضافة صنف';
    addItemBtn.addEventListener('click', () => { sec.items.push({ id: uid('i'), name:'', desc:'', price:'', image:'' }); scheduleSave(); render(); });
    secEl.appendChild(addItemBtn);

    const secActions = document.createElement('div'); secActions.className = 'section-actions';
    const delSecBtn = document.createElement('button');
    delSecBtn.className = 'btn ghost-danger'; delSecBtn.textContent = '🗑 حذف هذا القسم';
    delSecBtn.addEventListener('click', () => {
      if(confirm('حذف القسم "' + (sec.title||'') + '" وجميع أصنافه؟')){ state.sections.splice(si,1); scheduleSave(); render(); }
    });
    const moveUpBtn = document.createElement('button');
    moveUpBtn.className = 'btn'; moveUpBtn.textContent = '↑ نقل لأعلى';
    moveUpBtn.addEventListener('click', () => {
      if(si>0){ [state.sections[si-1], state.sections[si]] = [state.sections[si], state.sections[si-1]]; scheduleSave(); render(); }
    });
    const moveDownBtn = document.createElement('button');
    moveDownBtn.className = 'btn'; moveDownBtn.textContent = '↓ نقل لأسفل';
    moveDownBtn.addEventListener('click', () => {
      if(si < state.sections.length-1){ [state.sections[si+1], state.sections[si]] = [state.sections[si], state.sections[si+1]]; scheduleSave(); render(); }
    });
    secActions.appendChild(moveUpBtn); secActions.appendChild(moveDownBtn); secActions.appendChild(delSecBtn);
    secEl.appendChild(secActions);

    root.appendChild(secEl);

    if(si < state.sections.length - 1){
      const div = document.createElement('div'); div.className = 'coral-divider'; div.setAttribute('aria-hidden','true');
      div.innerHTML = '<svg viewBox="0 0 800 40" preserveAspectRatio="none"><path d="M0 20 Q 40 3, 80 20 T 160 20 T 240 20 T 320 20 T 400 20 T 480 20 T 560 20 T 640 20 T 720 20 T 800 20" fill="none" stroke-width="1.5"/></svg>';
      root.appendChild(div);
    }
  });
  updateActiveNav();
  observeAnimations();
}

function buildItemCard(sec, item, ii){
  const card = document.createElement('div'); card.className = 'item-card';
  const imgBox = document.createElement('div'); imgBox.className = 'item-imgbox';
  if(item.image){ const img = document.createElement('img'); img.src = item.image; imgBox.appendChild(img); }
  else { const ph = document.createElement('span'); ph.className='ph'; ph.textContent='📷'; imgBox.appendChild(ph); }

  const uploadWrap = document.createElement('div'); uploadWrap.className = 'img-upload-wrap';
  const upBtn = document.createElement('button');
  upBtn.type = 'button'; upBtn.className = 'img-upload-btn';
  upBtn.textContent = item.image ? '⬆ تغيير الصورة' : '⬆ رفع صورة';
  const fileInput = document.createElement('input');
  fileInput.type = 'file'; fileInput.accept = 'image/*'; fileInput.className = 'hidden-file-input';
  upBtn.addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', async (e) => {
    const file = e.target.files[0]; if(!file) return;
    try{ item.image = await readImageAsDataUrl(file, 700); scheduleSave(); render(); }
    catch(err){ alert('تعذّر رفع الصورة، تأكد من اختيار ملف صورة صالح'); }
  });
  uploadWrap.appendChild(upBtn); uploadWrap.appendChild(fileInput);
  if(item.image){
    const rmBtn = document.createElement('button');
    rmBtn.type = 'button'; rmBtn.className = 'img-remove-btn'; rmBtn.textContent = '✕ إزالة';
    rmBtn.addEventListener('click', () => { item.image = ''; scheduleSave(); render(); });
    uploadWrap.appendChild(rmBtn);
  }
  imgBox.appendChild(uploadWrap);
  card.appendChild(imgBox);

  const body = document.createElement('div'); body.className = 'item-body';
  const nameInput = document.createElement('input');
  nameInput.className = 'item-name-input'; nameInput.placeholder = 'اسم الصنف';
  nameInput.value = item.name; nameInput.disabled = !editMode;
  nameInput.addEventListener('input', e => { item.name = e.target.value; scheduleSave(); });

  const descInput = document.createElement('input');
  descInput.className = 'item-desc-input'; descInput.placeholder = 'وصف قصير (اختياري)';
  descInput.value = item.desc || ''; descInput.disabled = !editMode;
  descInput.addEventListener('input', e => { item.desc = e.target.value; scheduleSave(); });

  const foot = document.createElement('div'); foot.className = 'item-foot';
  const priceWrap = document.createElement('div'); priceWrap.className = 'price-wrap';
  const priceInput = document.createElement('input');
  priceInput.className = 'item-price-input'; priceInput.value = item.price || ''; priceInput.disabled = !editMode; priceInput.inputMode='numeric';
  priceInput.addEventListener('input', e => { item.price = e.target.value.replace(/[^\d]/g,''); scheduleSave(); });
  const unit = document.createElement('span'); unit.className='price-unit'; unit.textContent='د.ع';
  priceWrap.appendChild(priceInput); priceWrap.appendChild(unit);

  const actionsRow = document.createElement('div'); actionsRow.className = 'item-actions-row';
  const moveWrap = document.createElement('div'); moveWrap.style.cssText = 'display:flex; gap:4px;';
  const upBtn2 = document.createElement('button');
  upBtn2.type='button'; upBtn2.className='item-move-btn'; upBtn2.textContent='↑'; upBtn2.title='نقل لأعلى';
  upBtn2.addEventListener('click', () => { if(ii>0){ [sec.items[ii-1], sec.items[ii]] = [sec.items[ii], sec.items[ii-1]]; scheduleSave(); render(); } });
  const downBtn2 = document.createElement('button');
  downBtn2.type='button'; downBtn2.className='item-move-btn'; downBtn2.textContent='↓'; downBtn2.title='نقل لأسفل';
  downBtn2.addEventListener('click', () => { if(ii<sec.items.length-1){ [sec.items[ii+1], sec.items[ii]] = [sec.items[ii], sec.items[ii+1]]; scheduleSave(); render(); } });
  moveWrap.appendChild(upBtn2); moveWrap.appendChild(downBtn2);

  const delBtn = document.createElement('button');
  delBtn.className = 'del-item'; delBtn.textContent = '🗑 حذف الصنف';
  delBtn.addEventListener('click', () => { sec.items.splice(ii,1); scheduleSave(); render(); });

  actionsRow.appendChild(moveWrap); actionsRow.appendChild(delBtn);

  foot.appendChild(priceWrap);
  body.appendChild(nameInput); body.appendChild(descInput); body.appendChild(foot); body.appendChild(actionsRow);
  card.appendChild(body);
  return card;
}

function updateActiveNav(){
  const links = document.querySelectorAll('.catchip');
  const sections = document.querySelectorAll('.section');
  if(!sections.length) return;
  let current = sections[0].id;
  sections.forEach(sec => { if (window.scrollY >= sec.offsetTop - 170) current = sec.id; });
  links.forEach(a => a.classList.toggle('active', a.getAttribute('href') === '#' + current));
}
window.addEventListener('scroll', updateActiveNav, { passive:true });

function addNewSection(){
  const id = uid('s');
  state.sections.push({ id, title:'قسم جديد', note:'', image:'', items:[{ id: uid('i'), name:'', desc:'', price:'', image:'' }] });
  scheduleSave(); render();
  setTimeout(() => { const el = document.getElementById(id); if(el) el.scrollIntoView({ behavior:'smooth', block:'start' }); }, 50);
}

function wireHeaderInputs(){
  document.getElementById('logoUploadBtn').addEventListener('click', () => document.getElementById('logoFileInput').click());
  document.getElementById('logoFileInput').addEventListener('change', async e => {
    const file = e.target.files[0]; if(!file) return;
    try{ state.logoUrl = await readImageAsDataUrl(file, 500); scheduleSave(); render(); }
    catch(err){ alert('تعذّر رفع الصورة'); }
    e.target.value = '';
  });
  document.getElementById('logoRemoveBtn').addEventListener('click', () => { state.logoUrl = ''; scheduleSave(); render(); });
  document.getElementById('eyebrowInput').addEventListener('input', e => { state.hotelName = e.target.value; scheduleSave(); });
  document.getElementById('titleInput').addEventListener('input', e => { state.restaurantName = e.target.value; scheduleSave(); });
  document.getElementById('menuLabelInput').addEventListener('input', e => { state.menuLabel = e.target.value; scheduleSave(); });
  document.getElementById('footerMarkInput').addEventListener('input', e => { state.footerMark = e.target.value; scheduleSave(); });
  document.getElementById('footerTextInput').addEventListener('input', e => { state.footerText = e.target.value; document.getElementById('footerTextDisplay').textContent = e.target.value; scheduleSave(); });
}

function wireToolbar(){
  document.getElementById('saveNowBtn').addEventListener('click', saveNow);
  document.getElementById('addSectionTop').addEventListener('click', addNewSection);
  document.getElementById('addSectionBottom').addEventListener('click', addNewSection);
  document.getElementById('refreshBtn').addEventListener('click', async () => {
    if(dirty && !confirm('لديك تغييرات غير محفوظة، سيتم فقدانها عند التحديث. هل تريد المتابعة؟')) return;
    await loadState(); dirty = false; render(); setNote('تم التحديث', 'ok'); setTimeout(()=>setNote('',''),1500);
  });
  document.getElementById('openCustomerBtn').addEventListener('click', () => { window.open('customer.html', '_blank'); });
}

function initGate(){
  const gate = document.getElementById('gate');
  const input = document.getElementById('pinInput');
  const err = document.getElementById('pinErr');
  document.getElementById('unlockBtn').addEventListener('click', tryUnlock);
  input.addEventListener('keydown', e => { if(e.key === 'Enter') tryUnlock(); });
  function tryUnlock(){
    if(input.value === ADMIN_PIN){
      gate.remove();
      startApp();
    } else {
      err.textContent = 'رمز غير صحيح، حاول مجددًا';
      input.value = '';
    }
  }
  input.focus();
}

async function startApp(){
  document.body.classList.add('edit-mode');
  wireHeaderInputs();
  wireToolbar();
  await loadState();
  render();
}

initGate();

</script>
